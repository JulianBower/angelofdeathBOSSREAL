plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.angelofdeath.boss'

base {
    archivesName = 'angelofdeathboss'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        angelofdeathboss {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
